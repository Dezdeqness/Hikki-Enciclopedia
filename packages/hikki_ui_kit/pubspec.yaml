name: hikki_ui_kit
description: UI Components
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_gen_runner: 5.10.0
  build_runner: 2.4.15

flutter:
  generate: true

  uses-material-design: true
  assets:
    - assets/icons/
    - assets/lottie/

flutter_gen:
  output: lib/src/assets/
  line_length: 100
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
      class_name: HikkiAssets

  integrations:
    flutter_svg: true

